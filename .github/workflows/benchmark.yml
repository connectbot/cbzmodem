name: Transfer benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          dependency-graph: disabled
          validate-wrappers: true
          cache-read-only: true
      - name: Install interoperability peer
        run: sudo apt-get update && sudo apt-get install --yes lrzsz
      - name: Build benchmark client
        run: ./gradlew :testapp:installDist
      - name: Compare acknowledgment windows with simulated latency
        run: |
          set -o pipefail
          python3 tests/benchmark.py | tee benchmark.txt
          {
            echo '### Upload acknowledgment-window benchmark'
            echo '512 KiB upload with a simulated 10 ms response delay. Timings are informational.'
            echo '```text'
            cat benchmark.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: transfer-benchmark
          path: benchmark.txt
          if-no-files-found: ignore
          retention-days: 30
