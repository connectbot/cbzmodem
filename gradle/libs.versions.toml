[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
kstatemachine = "0.38.1"
metalava = "0.5.1"
spotless = "8.11.0"
black = "26.10.1"
release = "3.2.0"
cyclonedx = "3.5.1"
dokka = "2.2.0"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kstatemachine = { module = "io.github.nsk90:kstatemachine-jvm", version.ref = "kstatemachine" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
metalava = { id = "me.tylerbwong.gradle.metalava", version.ref = "metalava" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
release = { id = "net.researchgate.release", version.ref = "release" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
